name = "ecom"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

# R2 Bucket Binding (This connects Next.js directly to the bucket we created)
[[r2_buckets]]
binding = "R2"
bucket_name = "ecom"

# In your Cloudflare Dashboard (Pages -> Settings -> Environment Variables),
# you will need to add:
# DATABASE_URL="..."
# BETTER_AUTH_SECRET="..."
# NEXT_PUBLIC_APP_URL="..."
